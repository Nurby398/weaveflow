<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 单主题：只做明亮模式，声明 color-scheme 让浏览器原生控件（滚动条/表单）也走浅色 -->
    <meta name="color-scheme" content="light" />
    <!-- 字体**自托管**（见 src/styles/fonts.css）：不再有 fonts.googleapis.com 外链 ——
         内网/等保部署不会失联，也不再外发用户 IP；中文仍由 tokens.css 的系统字体栈兜底。
         preload 两档字重，减少首屏字体闪动（crossorigin 是字体预加载的硬要求）。 -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/quantico-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/quantico-700.woff2" crossorigin />
    <title>织流 WEAVEFLOW</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
