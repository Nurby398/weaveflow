name: ci

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    # 前端工程在子目录：仓库根放的是 platform-web/ 与 picture/
    working-directory: platform-web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: platform-web/package-lock.json

      # ★ 硬约束：picture/ 必须与 platform-web/ 同级，src/lib/avatars.js 在构建期直接 import 它。
      #   仓库已包含该目录；这一步只做「缺失即快速失败」的护栏，避免有人把它移走。
      - name: 校验 picture/ 与 platform-web/ 同级
        working-directory: .
        run: test -d picture && test -f picture/毕设选题与立项顾问.jpg

      - name: 安装依赖
        run: npm ci

      - name: 门禁（lint + format 检查 + 单测 + 构建）
        run: npm run verify

      # 覆盖率是「棘轮」：低于 vite.config.js 里的门槛即失败（只许涨不许跌）
      # 用 tee 留一份摘要给 Job Summary —— 门槛一红，日志里就能直接看到是哪个维度掉下来的
      - name: 覆盖率门槛
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-summary.txt

      - name: 覆盖率摘要（写入 Job Summary）
        if: always()
        run: tail -60 coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"

      # 安全门禁：生产依赖必须零高危（这些会进产物，属于交付面）
      # 显式指定官方 registry：本机/镜像源（npmmirror）不实现 audit 端点
      - name: 生产依赖漏洞（阻塞）
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

      # 开发工具链漏洞：只做可见性，不阻塞交付
      # 现状（2026-10-15）：vitest 2.x / vite 5.x 链路有 8 条（含 1 critical），
      # 修复需要 vitest 4 / vite 6+ 的破坏性升级 → 单独排期，见路线图 Wave 2。
      - name: 全量依赖漏洞（仅报告，不阻塞）
        continue-on-error: true
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  # E2E：自包含（仓里的假后端 scripts/mock-api.mjs + vite dev），不需要真后端与数据库
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform-web/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 安装浏览器内核
        run: npx playwright install --with-deps chromium

      - name: E2E（平台公共资源主路径）
        run: npm run test:e2e

      - name: 失败时上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: platform-web/playwright-report/
          retention-days: 7
